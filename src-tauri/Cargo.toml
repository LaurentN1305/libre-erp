# Socle P0 : pool SQLCipher privé, commandes métier authentifiées.
[package]
name = "securite-erp"
version = "0.13.0"
edition = "2021"
license = "GPL-3.0-only"
default-run = "securite-erp"
rust-version = "1.90"

[lib]
name = "securite_erp_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2.6", features = ["sqlite"] }
# DbInstances/DbPool du plugin reçoivent le pool SQLCipher construit côté Rust.
# Aucun preload ni permission SQL n'est accordé au frontend.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }
# Version commune à SQLx 0.8 à confirmer par cargo tree : un seul links=sqlite3.
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher-vendored-openssl"] }
tauri-plugin-updater = "=2.14.1"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync", "time", "rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"
semver = "1"
walkdir = "2"
fs2 = "0.4"
prost = "0.14"
flate2 = "1"
ssh2 = { version = "0.9.6", features = ["vendored-openssl", "openssl-on-win32"] }
rpassword = "7"
totp-rs = "5"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[patch.crates-io]
openssl-sys = { path = "vendor/openssl-sys" }
